name: Test CLI

on: [push, pull_request]

jobs:
  test-cli:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install package
        run: poetry install

      - name: Run CLI help
        run: poetry run cbiohub --help